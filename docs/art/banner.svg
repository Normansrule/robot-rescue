<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="'Trebuchet MS', Verdana, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fcbff"/><stop offset="1" stop-color="#e9f7ff"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb056"/><stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
    <g id="pip">
      <!-- PIP, origin at the cable port on its back (top of the drawing hangs from the cable) -->
      <ellipse cx="0" cy="62" rx="34" ry="31" fill="#f7f7ff" stroke="#c9cbe0" stroke-width="2"/>
      <rect x="-31" y="2" width="62" height="42" rx="12" fill="#f7f7ff" stroke="#c9cbe0" stroke-width="2"/>
      <rect x="-25" y="8" width="50" height="30" rx="8" fill="#141a33"/>
      <g fill="#4fe3ff">
        <rect x="-15" y="15" width="8" height="13" rx="3"><animate attributeName="height" values="13;13;1;13;13" keyTimes="0;0.92;0.95;0.98;1" dur="3.4s" repeatCount="indefinite"/></rect>
        <rect x="7" y="15" width="8" height="13" rx="3"><animate attributeName="height" values="13;13;1;13;13" keyTimes="0;0.92;0.95;0.98;1" dur="3.4s" repeatCount="indefinite"/></rect>
      </g>
      <line x1="0" y1="2" x2="0" y2="-20" stroke="#7d8196" stroke-width="3"/>
      <circle cx="0" cy="-22" r="6" fill="#ff8c26"/>
      <circle cx="-17" cy="95" r="10" fill="#7d8196"/><circle cx="17" cy="95" r="10" fill="#7d8196"/>
      <rect x="31" y="48" width="18" height="6" rx="3" fill="#7d8196"/>
      <rect x="47" y="42" width="10" height="18" rx="3" fill="#8bd7ff"/>
    </g>
  </defs>

  <rect width="1200" height="360" rx="22" fill="url(#sky)"/>

  <!-- drifting clouds -->
  <g fill="#ffffff" opacity="0.9">
    <g><animateTransform attributeName="transform" type="translate" from="-200 0" to="1300 0" dur="38s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="60" rx="60" ry="20"/><ellipse cx="35" cy="48" rx="38" ry="22"/></g>
    <g><animateTransform attributeName="transform" type="translate" from="-600 0" to="900 0" dur="52s" repeatCount="indefinite"/>
      <ellipse cx="300" cy="110" rx="70" ry="18"/><ellipse cx="330" cy="98" rx="40" ry="20"/></g>
  </g>

  <!-- ground -->
  <rect x="0" y="300" width="1200" height="60" fill="#a8e6cf"/>
  <rect x="0" y="300" width="1200" height="8" fill="#7fd1b0"/>

  <!-- gantry + hook -->
  <rect x="150" y="18" width="330" height="12" rx="6" fill="#4c6fbf"/>
  <rect x="160" y="18" width="10" height="290" fill="#4c6fbf"/>
  <rect x="460" y="18" width="10" height="290" fill="#4c6fbf"/>
  <circle cx="315" cy="40" r="11" fill="#ffd23f" stroke="#c99a00" stroke-width="3"/>

  <!-- PIP swinging on the Tether -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-28 315 40;28 315 40;-28 315 40" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="2.6s" repeatCount="indefinite"/>
    <line x1="315" y1="40" x2="315" y2="190" stroke="#ff8c26" stroke-width="5" stroke-linecap="round"/>
    <circle r="4" fill="#fff6c2"><animateMotion path="M315,190 L315,40" dur="0.9s" repeatCount="indefinite"/></circle>
    <use href="#pip" x="315" y="190"/>
  </g>

  <!-- helper drone stack -->
  <g transform="translate(-30 0)">
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="1.2s" repeatCount="indefinite"/>
    <rect x="1010" y="236" width="64" height="64" rx="8" fill="#8cc8ff" stroke="#5b8fd1" stroke-width="3"/>
    <rect x="1020" y="250" width="44" height="26" rx="5" fill="#141a33"/>
    <rect x="1030" y="256" width="7" height="11" rx="2" fill="#ffe36b"/><rect x="1047" y="256" width="7" height="11" rx="2" fill="#ffe36b"/>
    <rect x="1010" y="168" width="64" height="64" rx="8" fill="#ffb36b" stroke="#d98a3c" stroke-width="3"/>
    <rect x="1020" y="182" width="44" height="26" rx="5" fill="#141a33"/>
    <rect x="1030" y="188" width="7" height="11" rx="2" fill="#ffe36b"/><rect x="1047" y="188" width="7" height="11" rx="2" fill="#ffe36b"/>
    <g transform="translate(1042 166)"><rect x="-14" y="-10" width="28" height="7" rx="3" fill="#ff8c26">
      <animateTransform attributeName="transform" type="scale" values="1 1;-1 1;1 1" dur="1.6s" repeatCount="indefinite"/></rect></g>
  </g>
  </g>

  <!-- pot on a stove with steam -->
  <g transform="translate(210 0)">
  <rect x="880" y="250" width="100" height="50" rx="6" fill="#eb4d4d"/>
  <rect x="890" y="244" width="80" height="8" rx="3" fill="#ff6a1a"><animate attributeName="fill" values="#ff6a1a;#ffb347;#ff6a1a" dur="0.8s" repeatCount="indefinite"/></rect>
  <rect x="898" y="206" width="64" height="40" rx="8" fill="#a3b3cc"/>
  <g fill="#ffffff" opacity="0.8">
    <circle cx="915" cy="200" r="8"><animate attributeName="cy" values="200;150" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="200" r="10"><animate attributeName="cy" values="200;140" dur="1.8s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></circle>
  </g>
  </g>

  <!-- title -->
  <text x="740" y="108" text-anchor="middle" font-size="86" font-weight="bold" fill="url(#title)" stroke="#8a3d00" stroke-width="2">ROBOT</text>
  <text x="740" y="190" text-anchor="middle" font-size="86" font-weight="bold" fill="#4fe3ff" stroke="#0d5a73" stroke-width="2">RESCUE</text>
  <text x="740" y="226" text-anchor="middle" font-size="20" fill="#24406b">A cute co-op physics-puzzle game  ·  Unity 6 · URP</text>
</svg>
