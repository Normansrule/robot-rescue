<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="'Trebuchet MS', Verdana, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <g id="bot">
      <ellipse cx="0" cy="22" rx="20" ry="18" fill="#f7f7ff" stroke="#c9cbe0" stroke-width="2"/>
      <rect x="-18" y="-14" width="36" height="25" rx="7" fill="#f7f7ff" stroke="#c9cbe0" stroke-width="2"/>
      <rect x="-14" y="-10" width="28" height="17" rx="5" fill="#141a33"/>
      <rect x="-8" y="-6" width="5" height="8" rx="2" fill="#4fe3ff"/><rect x="3" y="-6" width="5" height="8" rx="2" fill="#4fe3ff"/>
      <circle cx="-9" cy="42" r="6" fill="#7d8196"/><circle cx="9" cy="42" r="6" fill="#7d8196"/>
      <circle cx="0" cy="-22" r="4" fill="#ff8c26"/><line x1="0" y1="-14" x2="0" y2="-19" stroke="#7d8196" stroke-width="2"/>
    </g>
  </defs>
  <rect width="960" height="300" rx="18" fill="#fffaf0"/>

  <!-- POWER -->
  <g>
    <rect x="12" y="12" width="300" height="276" rx="14" fill="#eef7ff" stroke="#bcd9f5" stroke-width="2"/>
    <text x="162" y="46" text-anchor="middle" font-size="26" font-weight="bold" fill="#2f6fd6">POWER</text>
    <text x="162" y="272" text-anchor="middle" font-size="14" fill="#4a5a75">plug into sockets: you are the battery</text>
    <rect x="200" y="150" width="90" height="90" rx="8" fill="#eb4d4d"/>
    <rect x="210" y="140" width="70" height="10" rx="3" fill="#555">
      <animate attributeName="fill" values="#555;#555;#ff6a1a;#ffb347;#ff6a1a" keyTimes="0;0.3;0.4;0.7;1" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="194" y="186" width="10" height="22" rx="2" fill="#222"/>
    <circle cx="200" cy="176" r="4" fill="#666"><animate attributeName="fill" values="#666;#666;#4dff7a;#4dff7a" keyTimes="0;0.3;0.35;1" dur="3s" repeatCount="indefinite"/></circle>
    <use href="#bot" x="70" y="190"/>
    <path d="M86,200 C120,240 160,230 194,197" fill="none" stroke="#ff8c26" stroke-width="5" stroke-linecap="round" stroke-dasharray="160" stroke-dashoffset="160">
      <animate attributeName="stroke-dashoffset" values="160;0;0" keyTimes="0;0.3;1" dur="3s" repeatCount="indefinite"/></path>
    <circle r="5" fill="#fff36b" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3;0.32;1" dur="3s" repeatCount="indefinite"/>
      <animateMotion path="M86,200 C120,240 160,230 194,197" dur="0.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- PULL -->
  <g>
    <rect x="330" y="12" width="300" height="276" rx="14" fill="#fff4e6" stroke="#f3d3a8" stroke-width="2"/>
    <text x="480" y="46" text-anchor="middle" font-size="26" font-weight="bold" fill="#d9731a">PULL</text>
    <text x="480" y="272" text-anchor="middle" font-size="14" fill="#4a5a75">yank objects (and drones) to you</text>
    <use href="#bot" x="385" y="190"/>
    <rect x="555" y="72" width="70" height="8" fill="#b38660"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-130 120;-130 120" keyTimes="0;0.35;0.7;1" calcMode="spline" keySplines="0 0 1 1;0.3 0 0.4 1;0 0 1 1" dur="3s" repeatCount="indefinite"/>
      <rect x="565" y="42" width="40" height="30" rx="4" fill="#ffcf4d" stroke="#c9952a" stroke-width="2"/>
      <rect x="573" y="50" width="24" height="12" rx="2" fill="#3a6fe0"/>
    </g>
    <line x1="400" y1="196" stroke="#ff8c26" stroke-width="5" stroke-linecap="round">
      <animate attributeName="x2" values="400;585;455;455" keyTimes="0;0.35;0.7;1" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="196;57;177;177" keyTimes="0;0.35;0.7;1" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;1;0" keyTimes="0;0.7;0.75;1" dur="3s" repeatCount="indefinite"/></line>
  </g>

  <!-- SWING -->
  <g>
    <rect x="648" y="12" width="300" height="276" rx="14" fill="#effaf2" stroke="#bfe6c9" stroke-width="2"/>
    <text x="798" y="46" text-anchor="middle" font-size="26" font-weight="bold" fill="#2d9a52">SWING</text>
    <text x="798" y="272" text-anchor="middle" font-size="14" fill="#4a5a75">hook on, swing, jump at the top</text>
    <rect x="660" y="226" width="60" height="22" fill="#b38660"/><rect x="876" y="226" width="60" height="22" fill="#b38660"/>
    <rect x="720" y="236" width="156" height="12" fill="#6fb6ff"><animate attributeName="y" values="236;238;236" dur="1.5s" repeatCount="indefinite"/></rect>
    <circle cx="798" cy="70" r="9" fill="#ffd23f" stroke="#c99a00" stroke-width="3"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="40 798 70;-40 798 70;40 798 70" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="2.4s" repeatCount="indefinite"/>
      <line x1="798" y1="70" x2="798" y2="160" stroke="#ff8c26" stroke-width="5" stroke-linecap="round"/>
      <use href="#bot" x="798" y="180"/>
    </g>
  </g>
</svg>
