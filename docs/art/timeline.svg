<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" font-family="'Trebuchet MS', Verdana, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1200" height="250" rx="22" fill="#fffaf2" stroke="#f0d9bd" stroke-width="3"/>
<text x="40" y="44" font-size="24" font-weight="bold" fill="#1d2440">Build log</text>
<line x1="120" y1="110" x2="1080" y2="110" stroke="#e3e8f3" stroke-width="8" stroke-linecap="round"/>
<line x1="120" y1="110" x2="120" y2="110" stroke="#36b35a" stroke-width="8" stroke-linecap="round"><animate attributeName="x2" from="120" to="888.0" dur="2.4s" begin="0.2s" fill="freeze"/></line>
<line x1="888.0" y1="110" x2="1080" y2="110" stroke="#aab3c8" stroke-width="4" stroke-dasharray="6 8"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1s" repeatCount="indefinite"/></line>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.4s" fill="freeze"/>
<circle cx="120.0" cy="110" r="12" fill="#36b35a" stroke="#fff" stroke-width="3"/>
<text x="120.0" y="92" font-size="14" fill="#5b6380" text-anchor="middle">10 Oct</text>
<text x="120.0" y="150" font-size="15" font-weight="bold" fill="#1d2440" text-anchor="middle">Core bot</text>
<text x="120.0" y="170" font-size="12.5" fill="#5b6380" text-anchor="middle">Tether: power, pull,</text>
<text x="120.0" y="186" font-size="12.5" fill="#5b6380" text-anchor="middle">swing · first kitchen</text>
</g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.4s" fill="freeze"/>
<circle cx="312.0" cy="110" r="12" fill="#36b35a" stroke="#fff" stroke-width="3"/>
<text x="312.0" y="92" font-size="14" fill="#5b6380" text-anchor="middle">11 Oct</text>
<text x="312.0" y="150" font-size="15" font-weight="bold" fill="#1d2440" text-anchor="middle">Chapters 1-2 + v0.3.0</text>
<text x="312.0" y="170" font-size="12.5" fill="#5b6380" text-anchor="middle">drones, gates, menu,</text>
<text x="312.0" y="186" font-size="12.5" fill="#5b6380" text-anchor="middle">first release + web build</text>
</g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.4s" fill="freeze"/>
<circle cx="504.0" cy="110" r="12" fill="#36b35a" stroke="#fff" stroke-width="3"/>
<text x="504.0" y="92" font-size="14" fill="#5b6380" text-anchor="middle">12 Oct</text>
<text x="504.0" y="150" font-size="15" font-weight="bold" fill="#1d2440" text-anchor="middle">Chapters 3-5</text>
<text x="504.0" y="170" font-size="12.5" fill="#5b6380" text-anchor="middle">toon look, open world,</text>
<text x="504.0" y="186" font-size="12.5" fill="#5b6380" text-anchor="middle">custom bots, Ch 1-4 run</text>
<text x="504.0" y="202" font-size="12.5" fill="#5b6380" text-anchor="middle">in Unity</text>
</g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.4s" fill="freeze"/>
<circle cx="696.0" cy="110" r="12" fill="#36b35a" stroke="#fff" stroke-width="3"/>
<text x="696.0" y="92" font-size="14" fill="#5b6380" text-anchor="middle">14 Oct</text>
<text x="696.0" y="150" font-size="15" font-weight="bold" fill="#1d2440" text-anchor="middle">Chapters 6-8</text>
<text x="696.0" y="170" font-size="12.5" fill="#5b6380" text-anchor="middle">Funland, Old Rig, the</text>
<text x="696.0" y="186" font-size="12.5" fill="#5b6380" text-anchor="middle">finale + credits</text>
</g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.4s" fill="freeze"/>
<circle cx="888.0" cy="110" r="14" fill="none" stroke="#ffb020" stroke-width="3"><animate attributeName="r" values="12;26" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.6s" repeatCount="indefinite"/></circle>
<text x="888.0" y="76" font-size="12" font-weight="bold" fill="#ffb020" text-anchor="middle">YOU ARE HERE</text>
<circle cx="888.0" cy="110" r="12" fill="#ffb020" stroke="#fff" stroke-width="3"/>
<text x="888.0" y="60" font-size="14" fill="#5b6380" text-anchor="middle">18 Oct</text>
<text x="888.0" y="150" font-size="15" font-weight="bold" fill="#1d2440" text-anchor="middle">All 20 scenes build</text>
<text x="888.0" y="170" font-size="12.5" fill="#5b6380" text-anchor="middle">Pump House 21/21 ·</text>
<text x="888.0" y="186" font-size="12.5" fill="#5b6380" text-anchor="middle">reserve battery · lost</text>
<text x="888.0" y="202" font-size="12.5" fill="#5b6380" text-anchor="middle">parts come home</text>
</g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.4s" fill="freeze"/>
<circle cx="1080.0" cy="110" r="12" fill="#aab3c8" stroke="#fff" stroke-width="3"/>
<text x="1080.0" y="92" font-size="14" fill="#5b6380" text-anchor="middle">Next</text>
<text x="1080.0" y="150" font-size="15" font-weight="bold" fill="#1d2440" text-anchor="middle">Playtest + co-op</text>
<text x="1080.0" y="170" font-size="12.5" fill="#5b6380" text-anchor="middle">play every call start to</text>
<text x="1080.0" y="186" font-size="12.5" fill="#5b6380" text-anchor="middle">finish, then 2-4 bots</text>
</g>
</svg>