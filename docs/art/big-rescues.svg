<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" font-family="'Trebuchet MS', Verdana, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="320" rx="18" fill="#fffaf0"/>

  <!-- COFFEE CRISIS -->
  <rect x="12" y="12" width="460" height="296" rx="14" fill="#fff0ee" stroke="#f2c4bd" stroke-width="2"/>
  <text x="242" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#c0392b">Ch 1 Big Rescue: COFFEE CRISIS</text>
  <g transform="translate(0 22)"><g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 0;-2 0;1 0;0 0" dur="0.25s" repeatCount="indefinite"/>
    <rect x="70" y="100" width="120" height="160" rx="20" fill="#d9534f"/>
    <ellipse cx="130" cy="100" rx="60" ry="26" fill="#e46a66"/>
    <circle cx="130" cy="160" r="34" fill="#fff" stroke="#999" stroke-width="3"/>
    <path d="M104,170 A28,28 0 0 1 156,170" fill="none" stroke="#e74c3c" stroke-width="6"/>
    <line x1="130" y1="160" x2="130" y2="132" stroke="#222" stroke-width="4" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-70 130 160;60 130 160;-20 130 160;-70 130 160" keyTimes="0;0.45;0.8;1" dur="6s" repeatCount="indefinite"/></line>
    <circle cx="130" cy="66" r="10" fill="#555"><animate attributeName="fill" values="#555;#555;#ff3b30;#555;#ff3b30;#555;#555" keyTimes="0;0.3;0.35;0.4;0.45;0.5;1" dur="6s" repeatCount="indefinite"/></circle>
  </g></g>
  <!-- three vents open one by one -->
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="240" y="200" width="16" height="70" fill="#3d7fff"/><text x="248" y="290" fill="#3d7fff">socket</text>
    <rect x="320" y="180" width="16" height="90" fill="#36b35a"/><text x="328" y="290" fill="#36b35a">1 drone</text>
    <rect x="400" y="160" width="16" height="110" fill="#e6b800"/><text x="408" y="290" fill="#b38f00">2 drones</text>
    <g fill="#fff" stroke="#cfd8e3" stroke-width="2">
      <circle cx="248" cy="186" r="12" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.15;0.2;0.85;1" dur="6s" repeatCount="indefinite"/><animate attributeName="r" values="10;16;10" dur="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="328" cy="166" r="12" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.4;0.85;1" dur="6s" repeatCount="indefinite"/><animate attributeName="r" values="10;16;10" dur="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="408" cy="146" r="12" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.55;0.85;1" dur="6s" repeatCount="indefinite"/><animate attributeName="r" values="10;16;10" dur="0.6s" repeatCount="indefinite"/></circle>
    </g>
  </g>
  <text x="242" y="68" text-anchor="middle" font-size="14" fill="#6b4a45">Open all three vents and hold them before the gauge hits red</text>

  <!-- PASTA PANIC -->
  <rect x="488" y="12" width="460" height="296" rx="14" fill="#eefaf3" stroke="#bfe6c9" stroke-width="2"/>
  <text x="718" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e8449">Ch 2 Big Rescue: PASTA PANIC</text>
  <text x="718" y="68" text-anchor="middle" font-size="14" fill="#3f5f4a">5 dishes for Mr. Grumbleton while the kitchen falls apart</text>
  <g font-size="14">
    <g transform="translate(510 100)">
      <rect width="130" height="80" rx="8" fill="#fff" stroke="#ccc"/>
      <text x="65" y="24" text-anchor="middle" font-weight="bold" fill="#333">Spaghetti</text>
      <text x="65" y="44" text-anchor="middle" fill="#777" font-size="12">boil: pasta</text>
      <rect x="10" y="58" width="110" height="10" rx="4" fill="#ddd"/>
      <rect x="10" y="58" width="110" height="10" rx="4" fill="#4caf50"><animate attributeName="width" values="110;10;110" dur="7s" repeatCount="indefinite"/><animate attributeName="fill" values="#4caf50;#ff9800;#f44336;#4caf50" keyTimes="0;0.4;0.49;0.5" dur="7s" repeatCount="indefinite"/></rect>
    </g>
    <g transform="translate(652 100)">
      <rect width="130" height="80" rx="8" fill="#fff" stroke="#ccc"/>
      <text x="65" y="24" text-anchor="middle" font-weight="bold" fill="#333">Tomato Sauce</text>
      <text x="65" y="44" text-anchor="middle" fill="#777" font-size="12">whisk: tomato</text>
      <rect x="10" y="58" width="110" height="10" rx="4" fill="#ddd"/>
      <rect x="10" y="58" width="80" height="10" rx="4" fill="#8bc34a"><animate attributeName="width" values="80;10;110;80" keyTimes="0;0.6;0.61;1" dur="9s" repeatCount="indefinite"/></rect>
    </g>
    <g transform="translate(794 100)">
      <rect width="130" height="80" rx="8" fill="#fff" stroke="#ccc"/>
      <text x="65" y="24" text-anchor="middle" font-weight="bold" fill="#333">Minestrone</text>
      <text x="65" y="44" text-anchor="middle" fill="#777" font-size="12">boil: tomato + carrot</text>
      <rect x="10" y="58" width="110" height="10" rx="4" fill="#ddd"/>
      <rect x="10" y="58" width="100" height="10" rx="4" fill="#4caf50"><animate attributeName="width" values="100;30;100" dur="11s" repeatCount="indefinite"/></rect>
    </g>
  </g>
  <text x="600" y="224" font-size="15" font-weight="bold" fill="#333">Mr. Grumbleton's mood</text>
  <rect x="600" y="234" width="300" height="16" rx="6" fill="#ddd"/>
  <rect x="600" y="234" width="300" height="16" rx="6" fill="#4caf50"><animate attributeName="width" values="300;300;200;200;100;300" keyTimes="0;0.3;0.32;0.7;0.72;1" dur="12s" repeatCount="indefinite"/></rect>
  <g font-size="22" font-weight="bold" fill="#ff7a1a" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.47;0.6;0.62;1" dur="12s" repeatCount="indefinite"/>
    <text x="718" y="290">FUSE BLOWN!</text></g>
  <g font-size="22" font-weight="bold" fill="#ff7a1a" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8;0.82;0.95;0.97;1" dur="12s" repeatCount="indefinite"/>
    <text x="718" y="290">CONVEYOR REVERSED!</text></g>
  <!-- critic face -->
  <g transform="translate(540 248)">
    <circle r="24" fill="#ffd9b8"><animate attributeName="fill" values="#ffd9b8;#ffd9b8;#ffb0a0;#ffb0a0;#ff7a6e;#ffd9b8" keyTimes="0;0.3;0.32;0.7;0.72;1" dur="12s" repeatCount="indefinite"/></circle>
    <rect x="-16" y="-36" width="32" height="14" fill="#3b3355"/><rect x="-22" y="-24" width="44" height="4" fill="#3b3355"/>
    <circle cx="-8" cy="-4" r="3" fill="#222"/><circle cx="8" cy="-4" r="3" fill="#222"/>
    <rect x="-12" y="6" width="24" height="4" rx="2" fill="#5a3b2a"/>
  </g>
</svg>
