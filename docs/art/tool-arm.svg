<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="960" height="210" font-family="'Trebuchet MS', Verdana, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="210" rx="18" fill="#f4f3ff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#3b3a6b">PIP's Tool Arm  ·  hold F / B to use, Tab / Y to swap</text>
  <!-- selection ring cycles through the four heads -->
  <rect y="58" width="200" height="130" rx="16" fill="none" stroke="#ff8c26" stroke-width="5">
    <animate attributeName="x" values="30;260;490;720;30" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></rect>

  <g transform="translate(130 112)">
    <circle r="34" fill="#ff8c26"/>
    <path d="M-16,-6 L-16,18 M16,-6 L16,18 M-16,-6 L16,-6" stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="scale" values="1 1;0.75 1;1 1" dur="1s" repeatCount="indefinite"/></path>
    <text y="62" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Grabber</text>
  </g>
  <g transform="translate(360 112)">
    <circle r="34" fill="#8bd7ff"/>
    <g stroke="#fff" stroke-width="4" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.6s" repeatCount="indefinite"/>
      <ellipse rx="10" ry="22"/><ellipse rx="10" ry="22" transform="rotate(60)"/><ellipse rx="10" ry="22" transform="rotate(120)"/></g>
    <text y="62" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Whisk  <tspan fill="#2d9a52">(Ch 2)</tspan></text>
  </g>
  <g transform="translate(590 112)" opacity="0.55">
    <circle r="34" fill="#ffd23f"/>
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <rect x="-4" y="-24" width="8" height="34" rx="2" fill="#fff"/><rect x="-10" y="6" width="20" height="16" rx="4" fill="#fff"/></g>
    <text y="62" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Screwdriver <tspan fill="#999">(later)</tspan></text>
  </g>
  <g transform="translate(820 112)" opacity="0.55">
    <circle r="34" fill="#ff5c5c"/>
    <path d="M-16,-14 L-16,6 A16,16 0 0 0 16,6 L16,-14" stroke="#fff" stroke-width="9" fill="none"/>
    <g fill="#ff5c5c" stroke="#fff" stroke-width="1"><circle cx="0" cy="-30" r="3"><animate attributeName="cy" values="-30;-22;-30" dur="0.8s" repeatCount="indefinite"/></circle></g>
    <text y="62" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Magnet <tspan fill="#999">(later)</tspan></text>
  </g>
</svg>
